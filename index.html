    <!-- Evita que o tema incorreto apareça durante o carregamento inicial. -->
    <script>
      (() => {
        let savedTheme = null;

        try {
          savedTheme = localStorage.getItem("willian-portfolio-theme");
        } catch {
          // O tema do sistema continua disponível quando o armazenamento é bloqueado.
        }

        const systemTheme = window.matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
        const initialTheme = savedTheme || systemTheme;
        document.documentElement.dataset.theme = initialTheme;
        document.querySelector('meta[name="theme-color"]').content =
          initialTheme === "dark" ? "#0d0e13" : "#f8f7fc";
      })();
    </script>
